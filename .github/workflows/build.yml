name: Compiler les APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            heuresolaire/build/outputs/apk/debug/*.apk
            pouls/build/outputs/apk/debug/*.apk
            cadran/build/outputs/apk/debug/*.apk
      - name: Publier les APK dans la release « apk »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp heuresolaire/build/outputs/apk/debug/*.apk out/heuresolaire.apk
          cp pouls/build/outputs/apk/debug/*.apk out/pouls.apk
          cp cadran/build/outputs/apk/debug/*.apk out/cadran-solaire.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk out/*.apk --title "APK à installer" --notes "Compilé depuis ${GITHUB_SHA::7}. Installer heuresolaire.apk et pouls.apk, puis cadran-solaire.apk."
